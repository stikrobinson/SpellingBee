<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spelling Bee Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="card">
        <p class="eyebrow">Spelling Bee Practice</p>
        <h1>Practica una palabra a la vez</h1>
        <p class="intro">
          Escucha la palabra, usa una pista en audio y despues haz el formato: palabra, deletreo, palabra.
        </p>

        <div class="word-panel">
          <div>
            <span class="label">Categoria</span>
            <p id="category" class="category"></p>
          </div>
          <div>
            <span class="label">Pista</span>
            <p id="hint" class="hint"></p>
          </div>
        </div>

        <div class="hint-controls">
          <span class="label">Tipo de pista</span>
          <div class="hint-options" role="radiogroup" aria-label="Tipo de pista">
            <label>
              <input type="radio" name="hint-type" value="definition" checked />
              Definicion
            </label>
            <label>
              <input type="radio" name="hint-type" value="example" />
              Ejemplo
            </label>
          </div>
        </div>

        <div class="control-actions">
          <button id="new-word" type="button">Nueva palabra</button>
          <button id="show-hint" type="button">Mostrar pista (opcional)</button>
          <button id="show-answer" type="button">Mostrar palabra correcta</button>
        </div>

        <p id="answer" class="answer">Palabra correcta oculta.</p>

        <div class="primary-actions">
          <button id="play-word" type="button">Escuchar palabra</button>
          <button id="start-spelling" type="button">Deletrear con voz</button>
        </div>

        <button id="toggle-transcript" type="button" class="toggle-transcript-btn">Ver lo que entendio el navegador</button>

        <div class="status-panel" id="status-panel" hidden>
          <span class="label">Lo que entendio el navegador</span>
          <p id="transcript" class="transcript">Aun no hay respuesta.</p>
        </div>

        <p id="feedback" class="feedback" aria-live="polite"></p>
        <p id="support-message" class="support-message"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
